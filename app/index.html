<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Builder</title>
<link rel="icon" href="icon.svg">
<style>
@font-face { font-family: 'VBGreek'; src: url('fonts/BLGreek.ttf') format('truetype'); }
@font-face { font-family: 'VBHebrew'; src: url('fonts/BLHebrew.ttf') format('truetype'); }
:root {
  --bg: #15110c; --panel: #1e1811; --panel2: #2a2116; --line: #3a2f20; --line2: #5a4728;
  --text: #efe6d2; --soft: #d8cbb0; --dim: #b8a888; --gold: #e2bd62; --gold2: #f3d27a; --gold3: #b8862c;
  --cream: #f1e6cc; --ink: #2a1f12; --ink2: #6b5636; --red: #c9634f; --redbg: #2e1a16; --green: #7fb36a; --greenbg: #1f2c1b;
  --serif: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button { font-family: inherit; font-size: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.f-grk { font-family: 'VBGreek', 'Times New Roman', serif; }
.f-heb { font-family: 'VBHebrew', 'Times New Roman', serif; direction: rtl; unicode-bidi: isolate; }
.f-en { font-family: var(--serif); }
h1, h2, h3 { font-family: var(--serif); color: #f3e5c0; margin: 0; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 20px; font-weight: 700; }
.hint { color: var(--dim); font-size: 13px; }
.muted { color: var(--soft); }
header { background: #1b160f; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.bar { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .t { font-family: var(--serif); font-size: 25px; font-weight: 700; color: #f3e5c0; line-height: 1; }
.brand .s { font-size: 12px; color: var(--dim); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { background: transparent; color: #e8dcc0; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 15px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 38px; }
.pill:hover { border-color: var(--gold); }
.pill.on { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.pill .c { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 4px; }
.deckpills .pill { border-radius: 8px; }
.deckmenu { position: relative; }
.deckmenu summary { list-style: none; display: inline-flex; align-items: center; gap: 2px; }
.deckmenu summary::-webkit-details-marker { display: none; }
.deckmenu .dm { position: absolute; left: 0; top: 46px; width: min(680px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.55); padding: 14px 16px; z-index: 40; display: flex; flex-direction: column; gap: 12px; }
.deckmenu .dh { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.alt { font-weight: 400; opacity: .8; }
.letters { display: flex; flex-wrap: wrap; gap: 3px; }
.lt { background: transparent; color: #e8dcc0; border: 1px solid var(--line2); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-weight: 600; font-size: 13px; padding: 0; }
.lt.on, .lt:hover { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.dlist { border-top: 1px solid var(--line); }
.drow { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 4px 6px; }
.drow.sel { background: #2f2517; }
.drow input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.drow .dw { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; color: var(--text); cursor: pointer; padding: 6px 0; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.drow .ds { color: var(--gold); font-size: 13px; } .drow .dt { color: var(--dim); font-size: 13px; }
.drow .dm1 { color: var(--soft); font-size: 14px; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow.have .dw b { color: var(--dim); }
.dhave { font-size: 12px; color: #9fc58a; white-space: nowrap; flex: none; }
.dfull { padding: 4px 12px 12px 36px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--soft); }
.dfull ol { margin: 0; padding-left: 18px; } .dfull li { margin: 4px 0; }
.dsrc { font-size: 11px; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.dbar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--panel2); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 14px; margin-top: 12px; z-index: 5; }
.linkbtn { background: none; border: 0; color: var(--gold); text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
.altw { font-size: 30px; color: #6b5636; margin-top: 4px; font-family: var(--serif), 'VBHebrew', 'Microsoft YaHei', 'Yu Gothic', 'Noto Sans CJK SC', sans-serif; }
.side .altw, .bcell .altw { color: #cdb98d; font-size: 22px; }
.search { position: relative; margin-left: auto; }
.search input { background: var(--bg); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; width: 210px; font-size: 14px; }
.results { position: absolute; right: 0; top: 42px; width: 340px; max-height: 420px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 30; }
.results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.results button:hover { background: var(--panel2); }
main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 60px; }
.row { display: flex; flex-wrap: wrap; gap: 22px; }
.grow { flex: 999 1 560px; min-width: 0; }
.side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.btn { background: var(--panel2); color: #f3e5c0; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.btn.outline { background: transparent; border-color: var(--gold); }
.btn.redline { background: transparent; color: #f3b3a5; border-color: #8a4a3c; }
.btn:disabled { opacity: .45; cursor: default; }
.wall { display: grid; grid-template-columns: repeat(50, minmax(0, 1fr)); gap: 2px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.tile { aspect-ratio: 1; border-radius: 2px; background: var(--panel2); border: 0; padding: 0; cursor: pointer; }
.tile.l1 { background: #5a4a2c; } .tile.l2 { background: #9a7b3c; } .tile.l3 { background: linear-gradient(135deg, var(--gold2), var(--gold3)); box-shadow: 0 0 4px rgba(226,189,98,.35); }
.tile.mx { background: #a8483a; }
.tile:hover { outline: 1px solid #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--soft); }
.legend span.sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.kpi .l { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.kpi .v { font-family: var(--serif); font-size: 36px; font-weight: 700; color: #f3e5c0; line-height: 1.15; }
.kpi .n { font-size: 13px; color: var(--soft); }
.card { display: block; width: 100%; min-height: 360px; text-align: center; cursor: pointer; background: var(--cream); color: var(--ink); border: 2px solid #c79a3c; border-radius: 18px; padding: 40px 36px 30px; box-shadow: 0 18px 40px rgba(0,0,0,.45); position: relative; }
.card .corner { position: absolute; top: 12px; font-size: 12px; color: #8a6a2c; letter-spacing: 1.5px; text-transform: uppercase; }
.card .corner.l { left: 18px; } .card .corner.r { right: 18px; text-transform: none; letter-spacing: 0; }
.card .big { font-size: 64px; font-weight: 700; line-height: 1.15; color: #3b2a12; word-break: break-word; }
.card .big.f-grk, .card .big.f-heb { font-weight: 400; font-size: 72px; }
.card .say { font-size: 22px; color: #8a5a12; margin-top: 8px; font-weight: 500; }
.card .tr { font-size: 18px; color: #6b4a14; margin-top: 4px; font-style: italic; }
.card .type { font-size: 15px; color: var(--ink2); margin-top: 6px; font-style: italic; }
.card ol { text-align: left; max-width: 680px; margin: 14px auto 0; padding-left: 24px; font-size: 19px; line-height: 1.55; }
.card .extra { font-size: 15px; color: var(--ink2); margin-top: 12px; }
.card .backhead { font-family: var(--serif); font-size: 32px; font-weight: 700; color: #3b2a12; }
.card .backhead .s { font-family: var(--sans); font-size: 16px; color: #8a5a12; font-weight: 500; }
.card .badge { display: inline-block; margin-top: 12px; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.ctrl { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
.gotbtn { border-radius: 10px; padding: 11px 26px; cursor: pointer; min-height: 44px; font-weight: 700; background: transparent; color: var(--gold); border: 1px solid var(--gold); }
.gotbtn.on { background: var(--gold); color: #1b1408; }
.progressbar { height: 7px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.progressbar > div { height: 100%; background: linear-gradient(90deg, var(--gold3), var(--gold2)); }
.batchgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bcell { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); cursor: pointer; }
.bcell:hover { border-color: var(--gold); }
.bcell.next { border-color: var(--gold); }
.bcell .h { font-weight: 600; } .bcell .d { font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.seg button { background: transparent; color: var(--soft); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 40px; }
.seg button.on { background: #2f2517; color: #f3e5c0; border-color: var(--gold); font-weight: 600; }
.lbl { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
select, input[type=text], input[type=date], textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
.qcard { background: var(--cream); color: var(--ink); border: 2px solid #c79a3c; border-radius: 18px; padding: 26px 30px; text-align: center; }
.qcard .p { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #8a6a2c; margin-bottom: 8px; }
.qcard .q { font-size: 50px; font-weight: 700; color: #3b2a12; line-height: 1.15; }
.qcard .q.f-grk, .qcard .q.f-heb { font-weight: 400; font-size: 58px; }
.qcard .q.meaning { font-family: var(--serif); font-size: 28px; font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; border-radius: 12px; padding: 13px 16px; min-height: 64px; background: var(--panel); border: 1px solid var(--line2); color: var(--text); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.opt .w2 { font-size: 26px; }
.opt.right { background: #24361f; border-color: var(--green); color: #dff0d4; }
.opt.wrong { background: #3a1f1a; border-color: var(--red); color: #f6d2c8; }
.fb { margin-top: 14px; border-radius: 12px; padding: 12px 16px; }
.fb.ok { background: var(--greenbg); border: 1px solid #4f7a42; color: #dff0d4; }
.fb.no { background: var(--redbg); border: 1px solid #8a4a3c; color: #f6d2c8; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; padding: 8px 6px; }
td { padding: 9px 6px; border-top: 1px solid var(--line); color: var(--soft); }
td b { color: var(--text); }
.scroll { overflow-x: auto; }
.list .it { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 160px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.chart .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.chart .c div { width: 100%; max-width: 40px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--gold2), #8a6420); }
.chart .c span { font-size: 10px; color: var(--soft); }
.axis { display: flex; gap: 4px; margin-top: 3px; } .axis span { flex: 1; text-align: center; font-size: 10px; color: var(--dim); min-width: 0; overflow: hidden; white-space: nowrap; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal .box { max-width: 760px; width: 100%; max-height: 92vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gold); color: var(--text); padding: 10px 18px; border-radius: 10px; z-index: 60; }
.ring text { font-family: var(--serif); }
.status { font-size: 12px; color: var(--dim); }
.hidden { display: none !important; }
@media (max-width: 760px) {
  .deckmenu .dm { left: -0px; position: fixed; top: auto; margin-top: 6px; left: 16px; right: 16px; width: auto; max-height: 70vh; overflow-y: auto; }
  .altw { font-size: 24px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .card .big { font-size: 46px; } .qcard .q { font-size: 38px; }
  .wall { grid-template-columns: repeat(25, minmax(0, 1fr)); }
  .search { margin-left: 0; } .search input { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="6" fill="#2a2116" stroke="#e2bd62" stroke-width="1.5"/><text x="17" y="24" text-anchor="middle" font-family="Palatino Linotype, Georgia, serif" font-size="21" font-weight="700" fill="#e2bd62">V</text></svg>
      <div><div class="t">Vocab Builder</div><div class="s">by Larry Dalton · runs on this computer</div></div>
    </div>
    <nav class="pills" id="tabs" aria-label="Main"></nav>
    <div class="pills deckpills" id="decks" role="group" aria-label="Deck"></div>
    <div class="search">
      <label for="find" class="hidden">Find a word</label>
      <input id="find" type="text" placeholder="Find a word…" autocomplete="off">
      <div id="results" class="results hidden"></div>
    </div>
  </div>
</header>
<main id="main"><p class="hint">Loading your words…</p></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
